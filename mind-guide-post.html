<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 사용 설명서 상세 | 모두의 테스트</title>
    <meta name="description" content="마음 사용 설명서 상세 글">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta property="og:site_name" content="모두의 테스트">
    <meta property="og:type" content="article">
    <meta property="og:title" content="마음 사용 설명서 상세">
    <meta property="og:description" content="MBTI 기반 심리 해설 상세 글">
    <meta property="og:image" content="https://sunyeonkim.github.io/mbti/resource/og-default.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-left">
            <a class="top-bar-logo" href="index.html">모두의 테스트</a>
        </div>
        <div class="top-bar-right">
            <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">
                <span id="theme-icon" aria-hidden="true">☀</span>
            </button>
            <button id="nav-toggle" class="icon-btn" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
        </div>
    </header>

    <div id="nav-overlay" class="nav-overlay" hidden></div>
    <aside id="side-nav" class="side-nav" aria-hidden="true">
        <div class="side-nav-header">
            <h2>모두의 테스트</h2>
            <button id="nav-close" class="icon-btn" type="button" aria-label="Close navigation">✕</button>
        </div>
        <nav class="side-nav-menu" id="side-nav-menu">
            <a class="nav-link" href="index.html">홈</a>
            <a class="nav-link" href="mind-guide.html">마음 사용 설명서</a>
            <a class="nav-link" href="service.html">서비스 소개</a>
            <a class="nav-link" href="privacy.html">개인정보처리방침</a>
            <a class="nav-link" href="terms.html">이용약관</a>
            <a class="nav-link" href="contact.html">문의하기</a>
        </nav>
        <div class="side-nav-footer">
            <label for="language-select">Language</label>
            <select id="language-select" aria-label="Language">
                <option value="ko">한국어</option>
                <option value="en">English</option>
            </select>
        </div>
    </aside>

    <main class="page-main">
        <div class="container wide-container">
            <section id="post-detail" class="mind-post-detail">
                <a href="mind-guide.html" class="primary-link">← 목록으로</a>
                <h1 id="post-title">마음 사용 설명서</h1>
                <div id="post-meta" class="mind-guide-meta"></div>
                <div id="post-content" class="mind-post-content"></div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="site-footer-inner">
            <p>© 2026 모두의 테스트. All rights reserved.</p>
            <div class="text-link-list footer-links">
                <a href="privacy.html">개인정보처리방침</a>
                <a href="terms.html">이용약관</a>
                <a href="contact.html">문의하기</a>
            </div>
        </div>
    </footer>

    <script src="mind-guide-data.js"></script>
    <script>
        (function () {
            const themeToggleBtn = document.getElementById("theme-toggle");
            const themeIconEl = document.getElementById("theme-icon");
            const navToggleBtn = document.getElementById("nav-toggle");
            const navCloseBtn = document.getElementById("nav-close");
            const navOverlayEl = document.getElementById("nav-overlay");
            const sideNavEl = document.getElementById("side-nav");
            const languageSelectEl = document.getElementById("language-select");
            const postTitleEl = document.getElementById("post-title");
            const postMetaEl = document.getElementById("post-meta");
            const postContentEl = document.getElementById("post-content");

            function applyTheme(theme) {
                document.body.setAttribute("data-theme", theme);
                if (themeIconEl) {
                    themeIconEl.textContent = theme === "dark" ? "🌙" : "☀";
                }
                localStorage.setItem("theme", theme);
            }

            function openNav() {
                if (!sideNavEl || !navOverlayEl || !navToggleBtn) return;
                sideNavEl.classList.add("open");
                sideNavEl.setAttribute("aria-hidden", "false");
                navOverlayEl.hidden = false;
                document.body.classList.add("nav-open");
                navToggleBtn.setAttribute("aria-expanded", "true");
            }

            function closeNav() {
                if (!sideNavEl || !navOverlayEl || !navToggleBtn) return;
                sideNavEl.classList.remove("open");
                sideNavEl.setAttribute("aria-hidden", "true");
                navOverlayEl.hidden = true;
                document.body.classList.remove("nav-open");
                navToggleBtn.setAttribute("aria-expanded", "false");
            }

            function getPostFromQuery() {
                const posts = Array.isArray(window.MIND_GUIDE_POSTS) ? window.MIND_GUIDE_POSTS : [];
                const slug = new URLSearchParams(window.location.search).get("post");
                return posts.find((item) => item.slug === slug) || posts[0] || null;
            }

            function buildExtendedArticleSection(post) {
                const title = String(post && post.title || "이 주제");
                const category = String(post && post.category || "마음 사용 설명서");
                return `
                    <h2>심화 해설: ${title}를 현실에 적용하는 방법</h2>
                    <p>${title}를 읽고 나면 가장 먼저 해야 할 일은 \"내 상황에서 어디부터 적용할지\"를 정하는 것입니다. 많은 사람들이 좋은 정보를 읽고도 변화가 없는 이유는 실행 단위가 너무 크기 때문입니다. 이 글의 핵심 개념을 실전에 붙일 때는 한 번에 모든 습관을 바꾸기보다, 이번 주에 바로 적용 가능한 한 가지 행동으로 시작하는 것이 훨씬 효과적입니다. 예를 들어 대화 방식, 일정 관리, 갈등 대응, 감정 기록처럼 측정 가능한 행동을 먼저 정하면 변화가 눈에 보이기 시작합니다.</p>
                    <p>특히 ${category} 카테고리의 글은 \"성격 라벨\"을 붙이기 위한 목적보다 \"반복 패턴\"을 알아차리는 목적에 가깝습니다. 같은 MBTI여도 삶의 맥락, 역할, 스트레스 수준에 따라 반응이 크게 달라질 수 있기 때문에, 단일 결과를 정체성처럼 고정해 해석하면 오히려 자기이해가 좁아집니다. 따라서 적용 단계에서는 결과를 믿는 것보다 기록을 믿는 것이 중요합니다. 오늘 어떤 상황에서 어떤 선택을 했는지, 그 선택 이후 감정과 결과가 어떻게 달라졌는지를 짧게 메모하면 데이터가 쌓이고, 그 데이터가 실제 변화를 만듭니다.</p>
                    <h3>실전 체크리스트</h3>
                    <ul>
                        <li>읽은 내용을 1문장으로 요약하고, 이번 주 실천 행동 1가지를 적는다.</li>
                        <li>적용 후 체감 변화를 \"좋았다/어려웠다\" 두 축으로 기록한다.</li>
                        <li>효과가 없으면 성격을 탓하지 말고 실행 단위를 더 작게 쪼갠다.</li>
                        <li>관계 주제라면 상대의 반응까지 함께 기록해 상호작용 패턴을 본다.</li>
                    </ul>
                    <h3>자주 생기는 오해</h3>
                    <p>첫 번째 오해는 \"나는 원래 이런 타입이라 안 바뀐다\"는 생각입니다. MBTI는 선호 경향을 보여주는 도구이지 변화 불가능성을 선언하는 도구가 아닙니다. 두 번째 오해는 \"반대 성향처럼 행동하면 가짜\"라는 해석입니다. 실제로는 상황 적합성에 따라 다양한 행동 전략을 선택할 수 있는 사람이 더 건강한 적응을 보입니다. 세 번째 오해는 \"유형이 맞으면 관계 문제가 자동 해결된다\"는 기대입니다. 관계의 질은 유형보다 대화 규칙, 회복 속도, 기대치 조율에서 결정됩니다.</p>
                    <p>${title} 주제를 제대로 활용하려면 지식 소비에서 끝내지 않고, 행동 실험으로 연결해야 합니다. 작은 실험은 부담이 적고 피드백이 빠르기 때문에 지속 가능성이 높습니다. 예를 들어 대화 전 감정 단어를 먼저 말하기, 일정 공유 규칙 정하기, 의사결정 기준을 한 줄로 합의하기 같은 미세한 변화는 즉시 관계나 업무 체감에 영향을 줍니다. 핵심은 완벽한 이론이 아니라 반복 가능한 운영입니다.</p>
                    <h3>4주 적용 플랜</h3>
                    <p>1주차에는 현재 패턴 관찰에 집중합니다. 2주차에는 개선할 장면 1개를 정해 실험합니다. 3주차에는 실험 결과를 바탕으로 방식(속도, 표현, 순서)을 조정합니다. 4주차에는 효과가 있었던 행동만 남겨 습관으로 고정합니다. 이렇게 하면 정보가 행동이 되고, 행동이 결과가 됩니다. 결국 ${title}의 가치는 \"나를 더 정확히 이해하고, 사람과 일의 마찰을 줄이는 데\" 있습니다. 이 기준으로 활용하면 MBTI 기반 콘텐츠는 재미를 넘어 실제 삶의 품질을 높이는 도구가 됩니다.</p>
                `;
            }

            function renderPost() {
                const post = getPostFromQuery();
                if (!post) return;
                if (postTitleEl) postTitleEl.textContent = post.title;
                if (postMetaEl) {
                    postMetaEl.innerHTML = `<span>${post.category || "마음 사용 설명서"}</span><span>${post.readTime || ""}</span><span>${post.updatedAt || ""}</span>`;
                }
                if (postContentEl) {
                    postContentEl.innerHTML = `${post.contentHtml || ""}${buildExtendedArticleSection(post)}`;
                }
                document.title = `${post.title} | 마음 사용 설명서`;
            }

            const savedTheme = localStorage.getItem("theme")
                || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            applyTheme(savedTheme);
            renderPost();

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener("click", () => {
                    const current = document.body.getAttribute("data-theme") || "light";
                    applyTheme(current === "dark" ? "light" : "dark");
                });
            }
            if (navToggleBtn) navToggleBtn.addEventListener("click", openNav);
            if (navCloseBtn) navCloseBtn.addEventListener("click", closeNav);
            if (navOverlayEl) navOverlayEl.addEventListener("click", closeNav);
            document.querySelectorAll(".side-nav-menu .nav-link").forEach((link) => {
                link.addEventListener("click", closeNav);
            });

            const savedLang = localStorage.getItem("language") || "ko";
            if (languageSelectEl) {
                languageSelectEl.value = savedLang;
                languageSelectEl.addEventListener("change", (event) => {
                    localStorage.setItem("language", event.target.value);
                });
            }

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    closeNav();
                }
            });
        }());
    </script>
</body>
</html>
